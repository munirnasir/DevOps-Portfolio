name: sales-service

# Runs only when the Sales service (or its tests) change.
on:
  push:
    branches: [main]
    paths:
      - 'services/sales-service/**'
      - 'services/tests/Pos.Sales.Tests/**'
      - 'services/tests/Pos.Sales.IntegrationTests/**'
      - '.github/workflows/sales-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/sales-service/**'
      - 'services/tests/Pos.Sales.Tests/**'
      - 'services/tests/Pos.Sales.IntegrationTests/**'
      - '.github/workflows/sales-service.yml'

concurrency:
  group: sales-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build services/sales-service/Pos.Sales.Api.csproj -c Release

      - name: Unit tests
        run: dotnet test services/tests/Pos.Sales.Tests -c Release

      # Testcontainers spins up a real Postgres; Docker is available on the runner.
      - name: Integration tests
        run: dotnet test services/tests/Pos.Sales.IntegrationTests -c Release

  image:
    name: Docker image
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only authenticate when we are going to push (i.e. not on pull_request).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build on every run; push to GHCR only on push events (never on pull_request).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/sales-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/pos-sales:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
